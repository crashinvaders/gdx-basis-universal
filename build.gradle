buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://s01.oss.sonatype.org' }
        gradlePluginPortal()
        mavenLocal()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        classpath "com.badlogicgames.gdx:gdx-jnigen-gradle:$jnigenVersion"
        classpath "com.vanniktech:gradle-maven-publish-plugin:0.37.0"
    }
}

allprojects {
    apply plugin: "idea"

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url 'https://s01.oss.sonatype.org' }
        maven { url "https://repo1.maven.org/maven2/" }
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }

    ext {
        projectGroup = 'com.crashinvaders.basisu'
        versionName = '1.1.2'
        isSnapshot = false
        version = "$versionName${isSnapshot ? '-SNAPSHOT' : ''}"
    }
}

/** Checks if the property exists and if not tries to resolve it from the environment variable. */
void resolveProperty(String propertyName, String envVariableName) {
    if (!project.hasProperty(propertyName)) {
        project.ext.propertyName = System.getenv(envVariableName)
        if (!project.ext.propertyName) {
            println "$propertyName is not defined"
        } else {
            println "$propertyName has been set from an environment variable."
        }
    }
}
// Setup Nexus repo and GitHub package repo credentials.
// They usually defined in user global gradle.properties file
// or as environment variables (Travis-CI).
resolveProperty('githubUsername', 'GITHUB_USERNAME')
resolveProperty('githubAccessToken', 'GITHUB_ACCESS_TOKEN')

def basisuLibProjects = [project(':basisu-wrapper'), project(':basisu-gdx'), project(':basisu-gdx-gwt')]

configure(basisuLibProjects) {
    apply plugin: 'java-library'
    // ".base" = extension only, no auto pomFromGradleProperties() (avoids duplicate POM entries against our own pom{} below).
    apply plugin: 'com.vanniktech.maven.publish.base'

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    compileJava.options.incremental = true

    version = ext.version
    group = ext.projectGroup

    // Relax doclint: sources have pre-existing errors (e.g. self-closing "<p/>") that
    // only now surface since the plugin properly depends on the real javadoc task.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    jar {
        from project.sourceSets.main.output
        from(project.sourceSets.main.allSource) {
            include '**/*.xml'
        }
        archiveBaseName = project.name
        duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    }

    // Publication name is fixed to "maven". Credentials: mavenCentralUsername/mavenCentralPassword
    // (Central Portal user token). Signing still uses signing.keyId/password/secretKeyRingFile.
    mavenPublishing {
        publishToMavenCentral(true) // automaticRelease
        signAllPublications()

        coordinates(project.group.toString(), project.name, project.version.toString())

        // basisu-gdx-gwt's GWT super-source classes only javadoc under JDK 8, so ship an
        // empty javadoc jar for it instead (Central still requires the artifact to exist).
        def javadocJarOption = project.name == 'basisu-gdx-gwt'
                ? new com.vanniktech.maven.publish.JavadocJar.Empty()
                : new com.vanniktech.maven.publish.JavadocJar.Javadoc()

        configure(new com.vanniktech.maven.publish.JavaLibrary(
                javadocJarOption,
                new com.vanniktech.maven.publish.SourcesJar.Sources()))

        pom {
            name = project.name
            description = project.description
            url = POM_URL
            licenses {
                license {
                    name = POM_LICENCE_NAME
                    url = POM_LICENCE_URL
                    distribution = POM_LICENCE_DIST
                }
            }
            developers {
                developer {
                    id = POM_DEV0_ID
                    name = POM_DEV0_NAME
                    email = POM_DEV0_EMAIL
                }
            }
            scm {
                connection = POM_SCM_CONNECTION
                developerConnection = POM_SCM_DEV_CONNECTION
                url = POM_SCM_URL
            }
        }
    }

    afterEvaluate { project ->
        // basisu-wrapper has a composite task `jnigenJarNativesAll`
        // that aggregates the rest of jar native tasks.
        project.tasks.findByName('jnigenJarNativesAll')?.dependsOn?.forEach { jarNativesTask ->
            publishing.publications.getByName('maven').artifact(jarNativesTask)
        }

        // The aggregate tasks below request `build` and `publish` together. Without
        // this ordering constraint Gradle may publish the previous (or not-yet-built)
        // archive while the build task is still producing it.
        tasks.matching { it.name.startsWith('publish') && it.name.contains('PublicationToMaven') }.configureEach {
            mustRunAfter tasks.named('build')
        }
    }

    // Invokes publish task if the version is a snapshot.
    tasks.register("publishSnapshot") {
        onlyIf { isSnapshot }
        dependsOn project.build
        dependsOn project.publish
    }
}

tasks.register("publishAll") {
    group 'GDX Basis Universal'
    description 'Publish all the Maven artifacts to the public repos.'

    basisuLibProjects.forEach { project ->
        dependsOn project.build
        dependsOn project.publish
    }
}

tasks.register("publishAllSnapshots") {
    group 'GDX Basis Universal'
    description 'Publish all the Maven artifacts to the public repos.' +
            'This task will only be execute if the current version is a snapshot.'

    basisuLibProjects.forEach { project ->
        dependsOn project.publishSnapshot
    }
}

tasks.register("installAll") {
    group 'GDX Basis Universal'
    description 'Installes all the Maven artifacts to the local Maven repo.'

    basisuLibProjects.forEach { project ->
        dependsOn project.build
        dependsOn project.publishToMavenLocal
    }
}
