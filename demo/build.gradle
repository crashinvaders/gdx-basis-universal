buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://s01.oss.sonatype.org' }
        gradlePluginPortal()
        mavenLocal()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$androidPluginVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
//        classpath "org.wisepersist:gwt-gradle-plugin:$gwtPluginVersion"
        classpath "org.docstr:gwt-gradle-plugin:$gwtPluginVersion"
        classpath "com.mobidevelop.robovm:robovm-gradle-plugin:$roboVmVersion"
        classpath "org.gretty:gretty:$grettyVersion"
    }
}

subprojects {
    ext.appName = 'gdx-basis-universal-demo'

    // true: depend on published Maven artifacts.
    // false: depend on the local library modules directly.
    ext.useGdxBasisuMavenArtifacts = false
    ext.gdxBasisuVersion = ext.version

    version = ext.version
    group 'com.crashinvaders.basisu.demo'
}